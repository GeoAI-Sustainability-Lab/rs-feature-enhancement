<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>CNN 與類神經網路請作答 — 遙感探測與實習</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: #0f1419; color: #e6e6e6; line-height: 1.6; }
header { background: linear-gradient(135deg, #2a1a52, #5c2c7c); padding: 18px 28px; border-bottom: 2px solid #8a4ab8; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.5); }
header h1 { margin: 0 0 6px 0; font-size: 22px; color: #fff; letter-spacing: 1px; }
nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
nav button, nav a.nav-link { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #d4d4f0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
nav button:hover, nav a.nav-link:hover { background: rgba(255,255,255,0.18); }
nav button.active { background: #8a4ab8; border-color: #c5b6db; color: #fff; box-shadow: 0 0 12px rgba(197,182,219,0.4); }
#userBar { margin-left: auto; color: #d8d4e0; font-size: 13px; }
#userBar .name { color: #fff; font-weight: bold; }
#userBar .timer { color: #c5b6db; font-weight: bold; margin-left: 12px; }
main { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }
section.page { display: none; animation: fade .25s ease; }
section.page.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
h2 { color: #c5b6db; border-bottom: 1px solid #4a3a5e; padding-bottom: 8px; }
h3 { color: #b89bdb; margin-top: 24px; }
.panel { background: #1a1a30; border: 1px solid #3a2a4a; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.panel h4 { margin: 0 0 12px 0; color: #b89bdb; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
.checkin { max-width: 480px; margin: 60px auto; background: #1a1a30; border: 1px solid #4a3a5e; border-radius: 12px; padding: 40px; text-align: center; }
.checkin h2 { border: none; font-size: 24px; }
.checkin input { width: 100%; background: #0f0f24; border: 1px solid #4a3a5e; color: #fff; padding: 12px 16px; border-radius: 6px; font-size: 15px; margin: 8px 0; font-family: inherit; }
.checkin button { width: 100%; background: #8a4ab8; border: none; color: #fff; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 16px; }
.checkin button:hover { background: #9c5ed0; }
.checkin button:disabled { background: #3a3a5a; cursor: not-allowed; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
.level-card { background: #1a1a30; border: 2px solid #3a2a4a; border-radius: 10px; padding: 16px 12px; text-align: center; cursor: pointer; transition: all .15s; }
.level-card .ico { font-size: 32px; }
.level-card .num { font-size: 11px; color: #b89bdb; font-weight: bold; letter-spacing: 2px; margin-top: 4px; }
.level-card .title { font-size: 13px; color: #d4d4f0; margin-top: 4px; }
.level-card .status { font-size: 10px; margin-top: 8px; padding: 3px 8px; border-radius: 10px; display: inline-block; }
.level-card.locked { opacity: 0.4; cursor: not-allowed; }
.level-card.locked .status { background: #2a2a3a; color: #8a8aa5; }
.level-card.available { border-color: #8a4ab8; }
.level-card.available:hover { background: #2a1f40; border-color: #b89bdb; transform: translateY(-2px); }
.level-card.available .status { background: rgba(138,74,184,0.3); color: #c5b6db; }
.level-card.current { border-color: #d4a04a; box-shadow: 0 0 12px rgba(212,160,74,0.3); }
.level-card.current .status { background: rgba(212,160,74,0.3); color: #d4a04a; }
.level-card.done { border-color: #4ab87e; }
.level-card.done .status { background: rgba(74,184,126,0.3); color: #4ab87e; }
.level-card.done .ico::after { content: ' ✓'; color: #4ab87e; }
.level-detail { margin-top: 24px; }
.level-detail .theory { background: rgba(138,74,184,0.08); border-left: 4px solid #b89bdb; padding: 16px 20px; border-radius: 0 8px 8px 0; margin-bottom: 16px; }
.level-detail .theory h3 { margin-top: 0; }
.challenge { background: linear-gradient(135deg, #2a1a3a, #4a2a5a); border: 2px solid #c5b5ff; border-radius: 10px; padding: 20px; }
.challenge h3 { color: #c5b5ff; margin-top: 0; }
.challenge .goal { background: rgba(197,181,255,0.15); border-left: 3px solid #c5b5ff; padding: 10px 16px; margin-bottom: 16px; border-radius: 0 4px 4px 0; }
.layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; margin-top: 12px; }
.canvas-wrap { background: #000; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; align-items: center; min-height: 200px; }
canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }
.control-row { margin-bottom: 14px; }
.control-row label { display: block; font-size: 13px; color: #d4c8e0; margin-bottom: 4px; }
.control-row .value { color: #b89bdb; font-weight: bold; margin-left: 6px; }
input[type=range] { width: 100%; accent-color: #b89bdb; }
select, input[type=text], input[type=number] { width: 100%; background: #0f0f24; border: 1px solid #4a3a5e; color: #e6e6e6; padding: 6px 10px; border-radius: 4px; font-size: 13px; font-family: inherit; }
button.btn { background: #8a4ab8; border: none; color: #fff; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; margin-right: 6px; margin-top: 4px; }
button.btn:hover { background: #9c5ed0; }
button.btn:disabled { background: #3a3a5a; cursor: not-allowed; }
button.btn.success { background: #4ab87e; }
button.btn.success:hover { background: #5ec88c; }
button.btn.danger { background: #b85a4a; }
button.btn.big { padding: 14px 30px; font-size: 15px; font-weight: bold; }
.score-display { font-size: 32px; text-align: center; padding: 16px; border-radius: 8px; margin-top: 16px; background: #0f0f24; }
.score-display.pass { color: #4ab87e; background: rgba(74,184,126,0.15); border: 1px solid #4ab87e; }
.score-display.almost { color: #d4a04a; background: rgba(212,160,74,0.15); border: 1px solid #d4a04a; }
.score-display.fail { color: #b85a4a; background: rgba(184,90,74,0.15); border: 1px solid #b85a4a; }
.split-view { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.split-view-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.kernel-grid { display: inline-grid; grid-template-columns: repeat(3, 56px); gap: 4px; }
.kernel-grid input { width: 56px; text-align: center; padding: 6px 4px; font-family: monospace; font-size: 14px; }
.leaderboard { background: #1a1a30; border-radius: 8px; overflow: hidden; margin-top: 16px; }
.leaderboard table { width: 100%; border-collapse: collapse; }
.leaderboard th { background: #2a1a52; padding: 12px 10px; text-align: left; color: #b89bdb; font-size: 13px; }
.leaderboard td { padding: 10px; border-top: 1px solid #3a2a4a; font-size: 13px; }
.leaderboard tr.done td { background: rgba(74,184,126,0.05); }
.lb-rank { font-weight: bold; color: #d4a04a; }
.lb-rank.gold { color: #ffd700; } .lb-rank.silver { color: #c0c0c0; } .lb-rank.bronze { color: #cd7f32; }
.setup-section { background: #1a1a30; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
.setup-section code { background: #0a0a18; color: #c5b6db; padding: 2px 6px; border-radius: 3px; font-family: Consolas, monospace; }
footer { text-align: center; padding: 20px; color: #5a5070; font-size: 12px; border-top: 1px solid #3a2a4a; margin-top: 30px; }
#animOverlay { position: absolute; pointer-events: none; }
.matrix-display { display: grid; gap: 1px; background: #2a2a4a; padding: 2px; border-radius: 4px; }
.matrix-cell { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: monospace; }
.feature-map-grid { display: grid; gap: 8px; }
.site-nav { background:#0a0a18; padding:8px 16px; font-size:12px; border-bottom:1px solid #3a2a4a; display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; }
.site-nav .lab { color:#8a8aa5; font-weight:bold; margin-right:4px; }
.site-nav a { color:#c5b6db; text-decoration:none; padding:4px 10px; border-radius:4px; background:rgba(197,182,219,0.08); }
.site-nav a:hover { background:rgba(197,182,219,0.20); }
.site-nav a.cur { background:#4ab87e; color:#fff; }
</style>
</head>
<body>

<div class="site-nav">
  <span class="lab">📚 教材導覽</span>
  <a href="../index.html">🌳 特徵強化請作答</a>
  <a href="../demo/index.html">🎓 特徵強化示範</a>
  <a href="../lab.html">🔬 自由探索</a>
  <a href="index.html" class="cur">🧠 CNN 請作答</a>
  <a href="demo/index.html">🎨 CNN 示範</a>
</div>

<header>
  <h1>🧠 CNN 與類神經網路 · 請作答</h1>
  <div style="font-size:12px;color:#c5b6db;margin-bottom:8px">國立中興大學 森林學系 · 大三 · 遙感探測與實習 · 大Q</div>
  <nav>
    <button class="nav-btn active" data-page="quest">📝 請作答</button>
    <button class="nav-btn" data-page="leaderboard">🏅 排行榜</button>
    <button class="nav-btn" data-page="setup">⚙️ 設定</button>
    <div id="userBar"></div>
  </nav>
</header>

<main>
<section id="page-quest" class="page active">
  <div id="questContent"></div>
</section>
<section id="page-leaderboard" class="page">
  <h2>🏅 排行榜（CNN 單元）</h2>
  <button class="btn" onclick="loadLeaderboard()">🔄 重新整理</button>
  <div id="leaderboardContent" class="leaderboard">
    <div style="padding:40px;text-align:center;color:#8a8aa5">點擊「重新整理」載入資料</div>
  </div>
</section>
<section id="page-setup" class="page">
  <h2>⚙️ 設定</h2>
  <div class="setup-section">
    <h3>📡 Google Sheet Web App URL</h3>
    <p>跟特徵強化共用同一個 Web App，但分數會記錄到 <code>Progress_CNN</code> 工作表。</p>
    <input type="text" id="webAppUrl" placeholder="https://script.google.com/macros/s/.../exec" style="font-family:monospace;font-size:12px">
    <div style="margin-top:8px">
      <button class="btn" onclick="saveWebAppUrl()">💾 儲存</button>
      <button class="btn" onclick="testWebApp()">🔬 測試連線</button>
    </div>
    <div id="webAppStatus" style="margin-top:10px;font-size:13px"></div>
  </div>
  <div class="setup-section">
    <h3>👤 本機資料</h3>
    <div id="localState"></div>
    <button class="btn danger" onclick="clearProgress()">🗑️ 清空本機進度（重新報到）</button>
  </div>
</section>
</main>

<footer>
  國立中興大學 森林學系 · 遙感探測與實習 · 大Q | CNN 模組 v1
</footer>

<script>
// ============================================================
// 全域狀態
// ============================================================
const STORAGE_KEY = 'rsfe_cnn_v1';
const DEFAULT_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyXtX_Z8bniRaOGWherLTAUpEDCxypUSIB9uWyR-OB6LvDAdIHmw2yIXiDj0t6UA5FUaw/exec';
const QUEST_NAME = 'cnn';
let APP = {
  studentId: null, studentName: null, startTime: null,
  webAppUrl: DEFAULT_WEBAPP_URL,
  unlockedLevel: 1, levelTimes: [null,null,null,null],
  levelScores: [null,null,null,null], currentLevel: null
};
function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) APP = Object.assign(APP, JSON.parse(s));
    // 相容舊版（5 關 → 現在 4 關）：把陣列截到 4 個元素
    ['levelTimes','levelScores','levelStartTimes'].forEach(k => {
      if (Array.isArray(APP[k]) && APP[k].length !== 4) APP[k] = APP[k].slice(0, 4).concat([null,null,null,null]).slice(0, 4);
    });
    if (APP.currentLevel && APP.currentLevel > 4) APP.currentLevel = null;
    if (APP.unlockedLevel > 5) APP.unlockedLevel = 4;
  } catch(e){}
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(APP)); } catch(e){} }

async function sheetCall(payload) {
  if (!APP.webAppUrl) return { error: 'no webapp URL' };
  payload.quest = QUEST_NAME;
  try {
    const res = await fetch(APP.webAppUrl, { method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(payload), redirect: 'follow' });
    return await res.json();
  } catch (e) { return { error: String(e) }; }
}

document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => switchPage(b.dataset.page)));
function switchPage(id) {
  document.querySelectorAll('section.page').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.querySelector(`.nav-btn[data-page="${id}"]`)?.classList.add('active');
  window.scrollTo({top: 0, behavior: 'smooth'});
  if (id === 'setup') renderSetup();
  if (id === 'leaderboard') loadLeaderboard();
}

const LEVEL_DEFS = [];

function renderQuest() {
  const container = document.getElementById('questContent');
  if (!APP.studentId) {
    container.innerHTML = `
      <div class="checkin">
        <h2>📝 報到 — CNN 單元</h2>
        <p style="color:#8a8aa5">輸入學號姓名開始作答</p>
        <input type="text" id="inputId" placeholder="學號" autocomplete="off">
        <input type="text" id="inputName" placeholder="姓名" autocomplete="off">
        <button id="checkinBtn" onclick="checkIn()">🚀 開始</button>
        <div id="checkinStatus" style="margin-top:10px;font-size:13px"></div>
        <div style="margin-top:20px;font-size:11px;color:#5a5070">
          ${APP.webAppUrl ? '✓ 已連線 Sheet（分數寫入 Progress_CNN）' : '⚠ 未設定 Sheet'}
        </div>
      </div>`;
    return;
  }
  const levels = LEVEL_DEFS.map((lv, i) => {
    const num = i + 1, done = APP.levelTimes[i] !== null, unlocked = num <= APP.unlockedLevel, current = APP.currentLevel === num;
    let cls = 'locked'; if (done) cls = 'done'; else if (current) cls = 'current'; else if (unlocked) cls = 'available';
    let status = '🔒 鎖定'; if (done) status = '✓ 已過 · ' + (APP.levelScores[i]||0) + '分'; else if (current) status = '⏳ 進行中'; else if (unlocked) status = '可作答';
    return `<div class="level-card ${cls}" onclick="${unlocked?`selectLevel(${num})`:''}"><div class="ico">${lv.icon}</div><div class="num">L${num}</div><div class="title">${lv.title}</div><div class="status">${status}</div></div>`;
  }).join('');
  const allDone = APP.levelTimes.every(t => t !== null);
  container.innerHTML = `
    <h2>🎯 CNN 單元 · 你的作答之旅</h2>
    <div class="levels">${levels}</div>
    ${allDone ? `<div class="panel" style="background:linear-gradient(135deg,#1a4030,#2a5040);border-color:#4ab87e;text-align:center"><h3 style="color:#5ec88c">🎉 CNN 單元全部完成！</h3><button class="btn success big" onclick="finishAll()">📤 提交結業</button></div>` : ''}
    <div id="levelDetail" class="level-detail"></div>`;
  if (APP.currentLevel && APP.currentLevel <= 4) renderLevel(APP.currentLevel);
}

function selectLevel(n) { if (!APP.levelStartTimes) APP.levelStartTimes = [null,null,null,null]; if (APP.levelStartTimes[n-1] === null) APP.levelStartTimes[n-1] = Date.now(); APP.currentLevel = n; saveState(); renderQuest(); setTimeout(()=>document.getElementById('levelDetail')?.scrollIntoView({behavior:'smooth',block:'start'}),100); }
function renderLevel(n) {
  const lv = LEVEL_DEFS[n-1]; if (!lv) return;
  const cont = document.getElementById('levelDetail');
  cont.innerHTML = `<div class="theory"><h3>${lv.icon} L${n} · ${lv.title}</h3><div>${lv.theory}</div></div><div class="challenge"><h3>🎯 挑戰任務</h3><div class="goal">${lv.goal}</div><div id="hintBox_${n}">${renderHintBox(n)}</div><div id="challengeBody"></div></div>`;
  lv.render();
}

async function checkIn() {
  const id = document.getElementById('inputId').value.trim();
  const name = document.getElementById('inputName').value.trim();
  const status = document.getElementById('checkinStatus');
  if (!id || !name) { status.innerHTML = '<span style="color:#ff6b6b">請輸入學號與姓名</span>'; return; }
  status.innerHTML = '<span style="color:#8a8aa5">⏳ 報到中...</span>';
  document.getElementById('checkinBtn').disabled = true;
  APP.studentId = id; APP.studentName = name; APP.startTime = Date.now();
  APP.unlockedLevel = 1; APP.levelTimes = [null,null,null,null]; APP.levelScores = [null,null,null,null]; APP.currentLevel = 1;
  saveState();
  if (APP.webAppUrl) {
    const r = await sheetCall({action:'recordStart', id:id, name:name});
    status.innerHTML = r.error ? `<span style="color:#d4a04a">⚠ 已開始（Sheet 同步失敗：${r.error}）</span>` : '<span style="color:#4ab87e">✓ 報到成功</span>';
  } else { status.innerHTML = '<span style="color:#d4a04a">✓ 已開始（純本機）</span>'; }
  setTimeout(()=>{ renderQuest(); updateUserBar(); }, 800);
}

async function finishAll() {
  if (APP.webAppUrl) {
    const r = await sheetCall({action:'recordFinish', id:APP.studentId});
    if (r.ok) alert(`🎓 CNN 單元已提交！總耗時 ${formatDur(r.totalSeconds)}`);
    else alert('提交失敗：' + (r.error || 'unknown'));
  } else {
    alert(`🎓 結業！總耗時 ${formatDur(Math.round((Date.now()-APP.startTime)/1000))}`);
  }
  switchPage('leaderboard');
}

function updateUserBar() {
  const bar = document.getElementById('userBar');
  if (!APP.studentId) { bar.innerHTML = ''; return; }
  const done = APP.levelTimes.filter(t=>t!==null).length;
  const total = APP.levelScores.reduce((a,b)=>a+(b||0),0);
  bar.innerHTML = `<span class="name">${APP.studentName}</span><span style="color:#8a8aa5">(${APP.studentId})</span><span style="margin-left:12px">題目：${done}/4</span><span style="margin-left:12px;color:#d4a04a">總分：${total}</span><span class="timer" id="elapsedTimer">—</span>`;
}
setInterval(() => { if (!APP.startTime||!APP.studentId) return; const el=document.getElementById('elapsedTimer'); if (el) el.textContent = formatDur(Math.round((Date.now()-APP.startTime)/1000)); }, 1000);
function formatDur(s) { if (!s||isNaN(s)) return '-'; const m=Math.floor(s/60); return m + ':' + String(s%60).padStart(2,'0'); }

function renderSetup() {
  document.getElementById('webAppUrl').value = APP.webAppUrl || '';
  const ls = document.getElementById('localState');
  if (APP.studentId) {
    const done = APP.levelTimes.filter(t=>t!==null).length;
    ls.innerHTML = `<p>姓名：<strong>${APP.studentName}</strong> · 學號：<code>${APP.studentId}</code></p><p>已開始：${new Date(APP.startTime).toLocaleString('zh-TW')}</p><p>進度：${done}/4</p>`;
  } else { ls.innerHTML = '<p style="color:#8a8aa5">尚未報到</p>'; }
}
function saveWebAppUrl() { APP.webAppUrl = document.getElementById('webAppUrl').value.trim() || null; saveState(); document.getElementById('webAppStatus').innerHTML = '<span style="color:#4ab87e">✓ 已儲存</span>'; }
async function testWebApp() {
  const url = document.getElementById('webAppUrl').value.trim();
  if (!url) return;
  APP.webAppUrl = url;
  document.getElementById('webAppStatus').innerHTML = '<span style="color:#8a8aa5">⏳ 測試中...</span>';
  try {
    const j = await (await fetch(url + '?action=ping')).json();
    if (j.ok) { saveState(); document.getElementById('webAppStatus').innerHTML = `<span style="color:#4ab87e">✓ 連線成功！${j.time}</span>`; }
  } catch(e) { document.getElementById('webAppStatus').innerHTML = `<span style="color:#ff6b6b">⚠ ${e.message}</span>`; }
}
function clearProgress() {
  if (!confirm('確定要清空本機進度嗎？')) return;
  const url = APP.webAppUrl;
  APP = { studentId:null, studentName:null, startTime:null, webAppUrl:url, unlockedLevel:1, levelTimes:[null,null,null,null], levelScores:[null,null,null,null], currentLevel:null };
  saveState(); renderSetup(); renderQuest(); updateUserBar(); switchPage('quest');
}

async function loadLeaderboard() {
  const cont = document.getElementById('leaderboardContent');
  cont.innerHTML = '<div style="padding:40px;text-align:center;color:#8a8aa5">⏳ 載入中...</div>';
  if (!APP.webAppUrl) { cont.innerHTML = '<div style="padding:40px;color:#d4a04a">尚未設定 URL</div>'; return; }
  const r = await sheetCall({action:'getLeaderboard'});
  if (r.error || !r.leaderboard) { cont.innerHTML = `<div style="padding:40px;color:#ff6b6b">${r.error||'unknown'}</div>`; return; }
  function parseL(s) { if (!s) return {time:null,score:null}; const m = String(s).match(/^(.+?)\s*\|\s*(\d+)$/); return m ? {time:m[1].trim(), score:parseInt(m[2])} : {time:String(s), score:null}; }
  const rows = r.leaderboard.map((s,i) => {
    const rank = i+1; let cls = ''; if(rank===1)cls='gold'; else if(rank===2)cls='silver'; else if(rank===3)cls='bronze';
    const parsed = s.levels.map(parseL);
    const total = parsed.reduce((a,p)=>a+(p.score||0),0);
    const levHtml = parsed.map(p => !p.time ? '<span style="color:#5a5070">·</span>' : p.score !== null ? `<span style="color:#4ab87e">${p.score}</span>` : '<span style="color:#4ab87e">✓</span>').join(' ');
    return `<tr class="${s.status==='done'?'done':''}"><td><span class="lb-rank ${cls}">#${rank}</span></td><td><strong>${s.name}</strong></td><td>${s.id}</td><td style="font-family:monospace">${levHtml}</td><td style="color:#d4a04a;font-weight:bold">${total}</td><td>${s.totalSec?formatDur(s.totalSec):'—'}</td><td>${s.status==='done'?'✓ 完成':s.status==='inprogress'?'進行中':s.status}</td></tr>`;
  }).join('');
  cont.innerHTML = `<table><thead><tr><th>名次</th><th>姓名</th><th>學號</th><th>L1-L4 分數</th><th>總分</th><th>時間</th><th>狀態</th></tr></thead><tbody>${rows || '<tr><td colspan="7" style="padding:30px;text-align:center;color:#8a8aa5">尚無資料</td></tr>'}</tbody></table>`;
}

// ============================================================
// 共用：分數提交
// ============================================================
function renderSubmitArea(lvNum, showLive) {
  return `${showLive ? `<div id="L${lvNum}LiveScore" class="score-display fail" style="margin-top:14px;font-size:24px">即時分數：—</div>` : ''}
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn success big" onclick="submitLevel(${lvNum})" style="flex:1">📤 提交查看分數</button></div>
    <div id="L${lvNum}SubmitMsg" style="margin-top:10px;font-size:13px"></div>`;
}
function updateLiveScore(lvNum) {
  const lv = LEVEL_DEFS[lvNum-1]; const score = lv.computeScore();
  const el = document.getElementById('L' + lvNum + 'LiveScore'); if (!el) return;
  el.textContent = '即時分數：' + score;
  el.className = 'score-display ' + (score >= lv.passThreshold ? 'pass' : score >= lv.passThreshold - 15 ? 'almost' : 'fail');
}
async function submitLevel(lvNum) {
  const lv = LEVEL_DEFS[lvNum-1]; const score = lv.computeScore();
  const msgEl = document.getElementById('L' + lvNum + 'SubmitMsg');
  if (score < lv.passThreshold) { msgEl.innerHTML = `<span style="color:#b85a4a">⚠ 分數 ${score} < ${lv.passThreshold}，未過關。繼續調整～</span>`; return; }
  const prev = APP.levelScores[lvNum-1] || 0; const isFirst = APP.levelTimes[lvNum-1] === null; const improved = score > prev;
  if (improved) APP.levelScores[lvNum-1] = score;
  if (isFirst) { APP.levelTimes[lvNum-1] = Date.now(); if (lvNum+1 > APP.unlockedLevel) APP.unlockedLevel = lvNum+1; APP.currentLevel = lvNum < 4 ? lvNum+1 : null; }
  saveState();
  if (APP.webAppUrl) sheetCall({action:'recordLevel', id:APP.studentId, level:lvNum, score:score});
  let txt;
  if (isFirst) txt = `🎉 L${lvNum} 過關！分數 <strong>${score}</strong>${lvNum<4?' · 下一關已解鎖':' · 全部完成！'}`;
  else if (improved) txt = `📈 分數從 ${prev} 提升到 <strong>${score}</strong>！`;
  else txt = `✓ 分數 ${score}（未超過 ${prev}）`;
  msgEl.innerHTML = `<span style="color:#4ab87e">${txt}</span>`;
  setTimeout(()=>{ renderQuest(); updateUserBar(); }, isFirst?1500:0);
}

// ============================================================
// CNN 數學工具
// ============================================================
function convolve2d(input, w, h, kernel, ksize, divisor, bias) {
  divisor = divisor || 1; bias = bias || 0;
  const out = new Float32Array(w*h);
  const kr = Math.floor(ksize/2);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let sum = 0;
      for (let ky = 0; ky < ksize; ky++) {
        for (let kx = 0; kx < ksize; kx++) {
          const sy = Math.max(0, Math.min(h-1, y+ky-kr));
          const sx = Math.max(0, Math.min(w-1, x+kx-kr));
          sum += input[sy*w+sx] * kernel[ky*ksize+kx];
        }
      }
      out[y*w+x] = sum / divisor + bias;
    }
  }
  return out;
}
function maxPool2d(input, w, h, size) {
  const ow = Math.floor(w/size), oh = Math.floor(h/size);
  const out = new Float32Array(ow*oh);
  for (let y = 0; y < oh; y++) {
    for (let x = 0; x < ow; x++) {
      let m = -Infinity;
      for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) {
        const v = input[(y*size+dy)*w + (x*size+dx)];
        if (v > m) m = v;
      }
      out[y*ow+x] = m;
    }
  }
  return { data: out, w: ow, h: oh };
}
function avgPool2d(input, w, h, size) {
  const ow = Math.floor(w/size), oh = Math.floor(h/size);
  const out = new Float32Array(ow*oh);
  const sq = size*size;
  for (let y = 0; y < oh; y++) for (let x = 0; x < ow; x++) {
    let s = 0;
    for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) s += input[(y*size+dy)*w + (x*size+dx)];
    out[y*ow+x] = s / sq;
  }
  return { data: out, w: ow, h: oh };
}
function relu(arr) { const out = new Float32Array(arr.length); for (let i=0;i<arr.length;i++) out[i] = Math.max(0, arr[i]); return out; }
function clip255(v) { return Math.max(0, Math.min(255, Math.round(v))); }
function floatToImageData(arr, w, h, lo, hi) {
  lo = lo || 0; hi = hi || 255;
  if (lo === 'auto') { lo = Math.min(...arr); hi = Math.max(...arr); }
  const range = hi - lo || 1;
  const imd = new ImageData(w, h);
  for (let i = 0; i < arr.length; i++) {
    const v = clip255((arr[i] - lo) / range * 255);
    imd.data[i*4] = v; imd.data[i*4+1] = v; imd.data[i*4+2] = v; imd.data[i*4+3] = 255;
  }
  return imd;
}
function similarity(a, b) {
  let sumSq = 0;
  for (let i = 0; i < a.length; i++) sumSq += (a[i]-b[i])*(a[i]-b[i]);
  const mse = sumSq / a.length;
  return Math.max(0, 1 - Math.sqrt(mse) / 60);
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============================================================
// 提示系統：每 10 分鐘解鎖一條提示
// ============================================================
function renderHintBox(n) {
  const hints = (typeof getLevelHints === 'function') ? getLevelHints(n) : [];
  if (hints.length === 0) return '';
  const start = (APP.levelStartTimes && APP.levelStartTimes[n-1]) || Date.now();
  const elapsedMin = (Date.now() - start) / 60000;
  const shown = Math.min(hints.length, Math.floor(elapsedMin / 10));
  let html = '<div style="background:rgba(212,160,74,0.10);border-left:3px solid #d4a04a;padding:12px 16px;margin:12px 0;border-radius:0 6px 6px 0;font-size:13px">';
  html += '<div style="font-size:11px;color:#d4a04a;margin-bottom:6px;letter-spacing:1px">💡 提示系統（每 10 分鐘解鎖一條）</div>';
  if (shown === 0) {
    const next = Math.max(0, Math.ceil(10 - elapsedMin));
    html += '<div style="color:#8aa5b5">🕒 還在思考中？再 <strong>' + next + '</strong> 分鐘會解鎖第 1 條提示。</div>';
  } else {
    for (let i = 0; i < shown; i++) {
      html += '<div style="color:#e5d0a8;margin-bottom:6px"><strong>提示 ' + (i+1) + '：</strong>' + hints[i] + '</div>';
    }
    if (shown < hints.length) {
      const nextAt = (shown + 1) * 10;
      const remain = Math.max(0, Math.ceil(nextAt - elapsedMin));
      html += '<div style="color:#5a7080;margin-top:8px;font-size:12px">🔒 下一條提示再 <strong>' + remain + '</strong> 分鐘解鎖。</div>';
    } else {
      html += '<div style="color:#4ab87e;margin-top:8px;font-size:12px">✓ 全部提示已解鎖。</div>';
    }
  }
  return html + '</div>';
}
setInterval(() => {
  const n = APP.currentLevel;
  if (!n) return;
  const box = document.getElementById('hintBox_' + n);
  if (box) box.innerHTML = renderHintBox(n).replace(/^<div[^>]+>|<\/div>$/g, '');
}, 30000);
