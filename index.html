// ============================================================
// UI
// ============================================================
function renderSidebar() {
  const aside = document.getElementById('sidebar');
  const groups = { feat_enh: [], cnn: [] };
  LESSONS.forEach(l => groups[l.quest].push(l));
  let html = `
    <h3>📂 選擇關卡</h3>
    <div class="quest-divider">🌳 特徵強化（feat_enh）</div>`;
  groups.feat_enh.forEach(l => {
    html += `<a class="lv-link" data-id="${l.id}" onclick="showLesson('${l.id}')">${l.icon} ${l.title}</a>`;
  });
  html += `<div class="quest-divider">🧠 CNN</div>`;
  groups.cnn.forEach(l => {
    html += `<a class="lv-link" data-id="${l.id}" onclick="showLesson('${l.id}')">${l.icon} ${l.title}</a>`;
  });
  aside.innerHTML = html;
}

function showLesson(id) {
  const l = LESSONS.find(x => x.id === id);
  if (!l) return;
  document.querySelectorAll('.lv-link').forEach(a => a.classList.toggle('active', a.dataset.id === id));
  const liveUrl = l.quest === 'cnn' ? `${LIVE_BASE}/cnn/` : `${LIVE_BASE}/`;
  const steps = l.steps.map((s, i) => `
    <div class="step-card" id="step-${i}">
      <div class="num-badge">步驟 ${i+1} / ${l.steps.length}</div>
      <h4>${s.title}</h4>
      <div class="action">▶ <strong>做：</strong>${s.desc || s.action || ''}</div>
      ${s.expected ? `<div class="expected">✓ <strong>預期看到：</strong>${s.expected}</div>` : ''}
      ${s.why ? `<div class="why">💡 <strong>為什麼：</strong>${s.why}</div>` : ''}
    </div>
  `).join('');
  document.getElementById('content').innerHTML = `
    <h2>${l.icon} ${l.title}</h2>
    <div class="lv-meta">
      <span class="tag ${l.quest === 'cnn' ? 'cnn' : ''}">${l.tag}</span>
      ⏱ ${l.time}　·　共 ${l.steps.length} 步
    </div>
    <div class="theory-box">
      <h4>📖 觀念</h4>
      <div>${l.theory}</div>
    </div>
    <div class="btn-row">
      <a class="btn" href="${liveUrl}" target="_blank">🚀 開作答頁（新分頁）</a>
      <a class="btn outline" onclick="document.getElementById('step-0').scrollIntoView({behavior:'smooth'})">⬇ 開始步驟</a>
    </div>
    <h3 style="color:#4ab87e;margin-top:30px">📋 逐步引導</h3>
    ${steps}
    <details class="answer-reveal">
      <summary>🔑 直接看答案（教學用 / 卡關時）</summary>
      <div class="ans">${l.answer}</div>
    </details>
    <div class="btn-row" style="margin-top:30px">
      <a class="btn" href="${liveUrl}" target="_blank">🚀 立刻去作答頁</a>
    </div>
  `;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

renderSidebar();
// auto-show first lesson
if (location.hash) {
  showLesson(location.hash.replace('#', ''));
}
window.addEventListener('hashchange', () => { if (location.hash) showLesson(location.hash.replace('#', '')); });
</script>
